# This repository holds the already-built al-folio site (the contents of _site),
# so there is nothing to build: publish the files as-is to the gh-pages branch.
name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
      - name: Stage site 📦
        run: |
          mkdir -p "$RUNNER_TEMP/site"
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='.DS_Store' --exclude='.gitignore' ./ "$RUNNER_TEMP/site/"
          # Skip Jekyll on GitHub Pages so prebuilt files (including _pages/) are served untouched
          touch "$RUNNER_TEMP/site/.nojekyll"
      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: ${{ runner.temp }}/site
